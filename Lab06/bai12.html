<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Kiểm tra năm nhuận</h2>
    <label for="year">Nhập năm:</label>
    <input type="number" id="year">
    <br><br>
    <button onclick="kiemTraNamNhuan()">Kiểm tra</button>
    <p id="result"></p>
    <script>
        function kiemTraNamNhuan() {
            let year = document.getElementById("year").value;
            if (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) {
                document.getElementById("result").innerHTML = "Năm " + year + " là năm nhuận.";
            } else {
                document.getElementById("result").innerHTML = "Năm " + year + " không phải là năm nhuận.";
            }
        }
    </script>
</body>
</html>
