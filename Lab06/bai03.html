<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Xếp loại học lực</h2>
    <label for="diem">Nhập điểm:</label>
    <input type="number" id="diem">
    <br><br>
    <button onclick="xepLoai()">Xếp loại</button>
    <h3 id="loai"></h3>
    <script>
        function xepLoai() {
            let diem = document.getElementById("diem").value;
            let loai = "";
            if (diem >= 90 && diem <= 100) {
                loai = "A";
            } else if (diem >= 80 && diem <= 89) {
                loai = "B";
            } else if (diem >= 70 && diem <= 79) {
                loai = "C";
            } else if (diem >= 60 && diem <= 69) {
                loai = "D";
            } else {
                loai = "F";
            }
            document.getElementById("loai").innerHTML = "Xếp loại: " + loai;
        }
    </script>
</body>
</html>
