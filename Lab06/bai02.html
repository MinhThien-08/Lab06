<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tính tuổi</h2>
    <label for="namsinh">Nhập năm sinh:</label>
    <input type="number" id="namsinh">
    <br><br>
    <button onclick="tinhTuoi()">Tính tuổi</button>
    <h3 id="age"></h3>
    <script>
        function tinhTuoi() {
            let namsinh = document.getElementById("namsinh").value;
            let namhientai = new Date().getFullYear();
            let tuoi = namhientai - namsinh;
            document.getElementById("age").innerHTML = "Tuổi của bạn là: " + tuoi;
        }
    </script>
</body>
</html>
