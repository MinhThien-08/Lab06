<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Máy tính đơn giản</h2>
    <label for="num1">Số thứ nhất:</label>
    <input type="number" id="num1">
    <br><br>
    <label for="num2">Số thứ hai:</label>
    <input type="number" id="num2">
    <br><br>
    <button onclick="tinhTong()">Cộng</button>
    <button onclick="tinhHieu()">Trừ</button>
    <button onclick="tinhTich()">Nhân</button>
    <button onclick="tinhThuong()">Chia</button>
    <h3 id="result"></h3>
    <script>
        function tinhTong() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let sum = num1 + num2;
            document.getElementById("result").innerHTML = "Cộng: " + sum;
        }

        function tinhHieu() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let diff = num1 - num2;
            document.getElementById("result").innerHTML = "Trừ: " + diff;
        }

        function tinhTich() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let product = num1 * num2;
            document.getElementById("result").innerHTML = "Nhân: " + product;
        }

        function tinhThuong() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let quotient = num1 / num2;
            document.getElementById("result").innerHTML = "Chia: " + quotient;
        }
    </script>
</body>
</html>
