<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Tính chỉ số BMI</h2>
    <label for="weight">Nhập cân nặng (kg):</label>
    <input type="number" id="weight">
    <br><br>
    <label for="height">Nhập chiều cao (m):</label>
    <input type="number" id="height">
    <br><br>
    <button onclick="calculateBMI()">Tính BMI</button>
    <p id="result"></p>
    <script>
        function calculateBMI() {
            let weight = document.getElementById("weight").value;
            let height = document.getElementById("height").value;
            let bmi = weight / (height * height);
            let loai = "";
            if (bmi < 18.5) {
                loai = "Gầy";
            } else if (bmi < 25) {
                loai = "Bình thường";
            } else {
                loai = "Thừa cân hoặc Béo phì";
            }
            document.getElementById("result").innerHTML = "Chỉ số BMI của bạn là: " + bmi.toFixed(2) + " - " + loai;
        }
    </script>
</body>
</html>
