<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Đoán số may mắn</h2>
    <label for="so">Nhập số:</label>
    <input type="number" id="so">
    <br><br>
    <button onclick="layso()">Lấy số</button>
    <h3 id="ketqua"></h3>
    <script>
        function layso() {
            let so = document.getElementById("so").value;
            let soMayMan = Math.floor(Math.random() * 10) + 1;
            if (so == soMayMan) {
                document.getElementById("ketqua").innerHTML = "Chúc mừng! Bạn đã đoán đúng số may mắn: " + soMayMan;
            } else {
                document.getElementById("ketqua").innerHTML = "Rất tiếc! Số may mắn là: " + soMayMan;
            }
        }
    </script>
</body>
</html>
